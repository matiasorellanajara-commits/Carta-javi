<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241728"><title>Para usted, mi señorita ❤️</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#211521;color:#fff4ec;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}.bg{position:fixed;inset:0;background:linear-gradient(180deg,#271b2b,#201522)}.grain{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 20%,transparent 10%,rgba(19,10,24,.42) 90%);pointer-events:none}.page{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center}.eyebrow{font:12px Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#ffdccd;margin-bottom:18px}.card{width:min(100%,520px);padding:35px 22px;border:1px solid rgba(255,229,218,.33);border-radius:22px;background:rgba(28,15,29,.46);box-shadow:0 15px 55px #0006;backdrop-filter:blur(8px)}h1{font-size:clamp(30px,7vw,45px);font-weight:normal;line-height:1.2;margin:0 0 22px}p{line-height:1.7}button{cursor:pointer;border:1px solid #ffe5d5;background:#f5d6ca;color:#3a2430;border-radius:100px;padding:14px 25px;font-size:15px;font-weight:bold;box-shadow:0 5px 20px #0003}.small{font:12px Arial,sans-serif;color:#f6d5cc;opacity:.9;margin-top:20px}.hidden{display:none!important}#poem{white-space:pre-line;min-height:190px;display:flex;align-items:center;justify-content:center;font-size:clamp(21px,5.2vw,29px);line-height:1.55;text-shadow:0 2px 12px #0008;opacity:0;transform:translateY(12px);transition:opacity 1.2s ease,transform 1.2s ease}#poem.show{opacity:1;transform:translateY(0)}.progress{height:2px;background:#ffffff30;border-radius:10px;overflow:hidden;margin-top:25px}.bar{height:100%;background:#ffded3;width:0;transition:width .8s}.controls{margin-top:20px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.controls button{padding:10px 16px;font-size:13px;background:#ffffff20;color:white}.footer{margin-top:22px;font-size:14px;font-style:italic;color:#ffddd1}.heart{font-size:28px;margin-bottom:12px;animation:beat 2s infinite}@keyframes beat{50%{transform:scale(1.14)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.page{justify-content:flex-start;gap:18px;padding:26px 15px 48px}.photo{margin:0;width:min(100%,520px);overflow:hidden;border-radius:22px;border:1px solid rgba(255,229,218,.33);box-shadow:0 12px 32px #0005;background:#342632}.photo img{display:block;width:100%;height:auto;max-height:46svh;object-fit:contain}.card{background:rgba(28,15,29,.9);backdrop-filter:none}.grain{opacity:.3}#poem{min-height:190px}@media(min-width:750px){.photo img{max-height:52svh}}</style></head>
<body><div class="bg"></div><div class="grain"></div><main class="page"><figure class="photo"><img src="foto.jpg" alt="Nuestro momento juntos"></figure><div class="card"><div class="heart">♡</div><div class="eyebrow">Una carta desde mi corazón</div>
<section id="intro"><h1>Para usted,<br>mi señorita Javi</h1><p>Hay cosas que no sé explicar…<br>pero que mi corazón necesita decirle.</p><button id="start">Abrir mi carta ❤️</button><div class="small">Active el sonido para escuchar el piano</div></section>
<section id="letter" class="hidden"><div id="poem" aria-live="polite"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="controls"><button id="sound">♫ Silenciar</button><button id="next">Siguiente →</button><button id="replay" class="hidden">Volver a leer ↺</button></div><div class="footer" id="footer">Con cariño, para usted ♡</div></section>
</div></main><script>
const verses=["No sé en qué momento llegó a mi vida,\nni cómo logró cambiar tanto en tan pocos días.", "Solo sé que desde que la conocí,\nhay algo en mi corazón que volvió a sonreír.", "Llegó sin avisar, sin prometerme nada,\ny terminó convirtiéndose en esa persona\nque espero con ansias cada mañana.", "Quién diría que en tan poquito tiempo\níbamos a compartir tantas risas,\nabrazos, miradas y besos guardados en el alma.", "Y aunque a veces nos separen kilómetros,\nno hay distancia capaz de alejarla\nde mis pensamientos.", "Cuando estoy con usted, mi amor,\nel tiempo parece detenerse.\nY cuando me despido, ya quiero volver a verla.", "No voy a prometerle una historia perfecta,\nporque sé que habrá días difíciles.", "Pero sí le prometo algo sincero:\nmientras usted quiera caminar conmigo,\nyo voy a estar ahí, eligiéndola de nuevo.", "Quiero conocer sus alegrías, sus miedos,\nsus sueños, sus días buenos\ny aquellos en que solo necesite un abrazo.", "No quiero quererla solo cuando todo sea bonito.\nQuiero estar también cuando el mundo\nse ponga difícil.", "Porque yo no quiero algo a medias con usted.\nQuiero ser parte de sus mañanas,\nde sus noches y de lo que está por venir.", "Y si me pregunta qué quiero con usted,\nmi respuesta es sencilla:\nlo quiero todo.", "Quiero entregarle mi cariño sin miedo,\nmi tiempo sin condiciones\ny mi corazón sin reservas.", "Hay personas que necesitan años\npara hacernos sentir lo que usted\ndespertó en mí en tan poco tiempo.", "No sé qué nos tendrá preparada la vida,\npero sí sé lo que quiero:\ncuidarla, quererla y respetarla.", "Entre tantas personas y tantos caminos,\nla vida me puso frente a usted.", "Y si pudiera volver al día en que nos conocimos,\nvolvería a elegir ese mismo camino,\nuna y mil veces.", "Porque quiero que mi presente sea con usted\ny que mi futuro también lleve su nombre.", "De todas las coincidencias que me regaló la vida,\nusted es la que quiero convertir en mi destino. ❤️", "Con todo mi corazón,\npara usted, mi Javi. ❤️"];let index=0,timer=null,audio=null,muted=false,musicTimer=null,step=0;
const poem=document.getElementById('poem'),bar=document.getElementById('bar');
function note(freq,when,dur,vol){if(!audio||muted)return;let osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0.0001,when);gain.gain.exponentialRampToValueAtTime(vol,when+.035);gain.gain.exponentialRampToValueAtTime(.0001,when+dur);osc.connect(gain);gain.connect(audio.destination);osc.start(when);osc.stop(when+dur+.03)}
const chords=[[261.63,329.63,392],[220,261.63,329.63],[174.61,261.63,349.23],[196,246.94,392]];
function playMusic(){if(!audio||muted)return;const t=audio.currentTime+.08,c=chords[step%4];note(c[0]/2,t,2.8,.035);c.forEach((f,i)=>note(f,t+i*.37,2.1,.027));note(c[2]*2,t+1.6,.7,.012);step++}
function startMusic(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();playMusic();musicTimer=setInterval(playMusic,3100)}catch(e){document.getElementById('sound').textContent='♫ Música no disponible'}}
function show(){clearTimeout(timer);poem.classList.remove('show');setTimeout(()=>{poem.textContent=verses[index];poem.classList.add('show');bar.style.width=((index+1)/verses.length*100)+'%';if(index===verses.length-1){document.getElementById('replay').classList.remove('hidden');document.getElementById('next').classList.add('hidden');document.getElementById('footer').textContent='Siempre suyo. ❤️'}else{timer=setTimeout(()=>{index++;show()},7500)}},420)}
document.getElementById('start').onclick=()=>{document.getElementById('intro').classList.add('hidden');document.getElementById('letter').classList.remove('hidden');startMusic();show()};
document.getElementById('next').onclick=()=>{if(index<verses.length-1){index++;show()}};
document.getElementById('replay').onclick=()=>{index=0;document.getElementById('replay').classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.getElementById('footer').textContent='Con cariño, para usted ♡';show()};
document.getElementById('sound').onclick=e=>{muted=!muted;e.target.textContent=muted?'♫ Activar música':'♫ Silenciar';if(!muted&&!audio)startMusic()};
</script></body></html>
